<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Login — Sitekit</title>
    <link rel="stylesheet" href="assets/css/sitekit.css" />
  </head>
  <body>
    <header class="nx-nav" data-nav>
      <div class="nx-nav__inner">
        <a class="nx-brand" href="index.html">
          <svg class="nx-brand__mark" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path fill="currentColor" d="m12.8 3.44c-.38-.5-1.22-.5-1.6 0L2.2 15.44c-.18.24-.24.56-.17.85s.28.54.56.66l9 4c.13.06.27.09.41.09s.28-.03.41-.09l9-4c.28-.12.48-.37.56-.66s.02-.61-.17-.85L12.8 3.44Zm-1.8 15.06-6.45-2.87 6.45-8.6v11.47Zm2 0V7.04l6.45 8.6-6.45 2.86Z" fill="currentColor"/></svg>
          Sitekit
        </a>
        <div class="nx-actions">
          <a class="nx-btn nx-btn--ghost" href="create-account.html">Get Started</a>
          <button class="nx-menu-btn" type="button" aria-label="Open menu" data-menu><span></span><span></span><span></span></button>
        </div>
      </div>
    </header>
    <div class="nx-drawer" data-drawer>
      <div class="nx-drawer__scrim" data-drawer-close></div>
      <nav class="nx-drawer__panel">
        <a href="create-account.html">Get Started</a>
        <a href="forgot-password.html">Forgot password</a>
        <a href="index.html">Home</a>
      </nav>
    </div>

    <main class="nx-auth">
      <aside class="nx-auth__aside">
        <h2>Welcome back</h2>
        <p>Next.js-calm auth chrome—Liferay Login portlet drops in during SI conversion.</p>
      </aside>
      <div class="nx-auth__main">
        <div class="nx-auth__card">
          <h1>Login</h1>
          <p>Sign in to continue learning.</p>
          <form data-auth-form="Logged in">
            <div class="nx-field"><label for="email">Email</label><input id="email" type="email" required autocomplete="username" /></div>
            <div class="nx-field"><label for="password">Password</label><input id="password" type="password" required autocomplete="current-password" /></div>
            <div class="nx-auth__meta"><a href="forgot-password.html">Forgot password?</a></div>
            <button class="nx-btn nx-btn--black" type="submit" style="width:100%">Continue</button>
          </form>
          <p class="nx-auth__alt">No account? <a href="create-account.html">Get Started</a></p>
        </div>
      </div>
    </main>
    <div class="nx-toast" data-toast></div>
    <script src="assets/js/sitekit.js"></script>
  </body>
</html>
